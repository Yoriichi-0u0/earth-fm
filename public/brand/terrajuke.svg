<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- TerraJuke mark: a record whose label is Earth, with one scan line crossing the grooves. Original artwork. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#0047d6"/>
    </linearGradient>
    <radialGradient id="vinyl" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </radialGradient>
    <radialGradient id="earth" cx=".36" cy=".32" r=".8">
      <stop offset="0" stop-color="#9be3ff"/>
      <stop offset=".5" stop-color="#2b8cf0"/>
      <stop offset="1" stop-color="#0c3486"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28.5" fill="url(#tile)"/>
  <circle cx="64" cy="64" r="44" fill="url(#vinyl)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.4">
    <circle cx="64" cy="64" r="39"/><circle cx="64" cy="64" r="33.5"/><circle cx="64" cy="64" r="28"/><circle cx="64" cy="64" r="22.5"/>
  </g>
  <circle cx="64" cy="64" r="16" fill="url(#earth)"/>
  <path d="M57 58c3-3 8-3 10 0s-1 5 2 7-2 6-6 5-3-4-6-5-3-4 0-7z" fill="#7ee08a" fill-opacity=".85"/>
  <line x1="64" y1="64" x2="94.5" y2="33.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="2.6" fill="#0b0b0e"/>
</svg>
