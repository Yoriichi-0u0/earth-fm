<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#080f14" />
    <style>
      :root{background:#f4f6f3;color:#172a30;color-scheme:light}
      :root[data-theme=dark]{background:#090f14;color:#edf3ef;color-scheme:dark}
      @media(prefers-color-scheme:dark){:root:not([data-theme=light]){background:#090f14;color:#edf3ef;color-scheme:dark}}
    </style>
    <script>
      // Resolve before the module/CSS loads; the shared provider adopts the same preference.
      (()=>{let p='auto';try{const v=localStorage.getItem('terrajuke-appearance')??localStorage.getItem('earth-fm-appearance');if(v==='light'||v==='dark')p=v;}catch{}
        const t=p==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;
        document.documentElement.dataset.appearance=p;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;
        document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#090f14':'#f4f6f3';})();
    </script>
    <meta name="description" content="Hear NASA’s view of Earth. TerraJuke turns NASA Earth visualizations into live music you can play like a jukebox: climate, night lights and the air we share." />
    <meta property="og:title" content="TerraJuke — The Earth Information Jukebox" />
    <meta property="og:description" content="Hear NASA’s view of Earth: NASA visualizations turned into live music you can play like a jukebox." />
    <meta property="og:image" content="https://terrajuke.vercel.app/brand/terrajuke-art-1200.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>TerraJuke — The Earth Information Jukebox</title>
    <link rel="icon" type="image/png" sizes="128x128" href="/brand/terrajuke.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/terrajuke-mark-512.png" />
    <link rel="apple-touch-icon" href="/brand/terrajuke-touch-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
